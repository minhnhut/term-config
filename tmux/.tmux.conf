# ----------------------------
# GENERAL TMUX SETTINGS
# ----------------------------

# Set default terminal to 256 colors for richer palette
set -g default-terminal "screen-256color"

# Increase scrollback buffer history limit
set -g history-limit 10000

# Enable mouse support (clicking to switch panes/windows, scrolling)
set -g mouse on

# Allow programs to bypass tmux with escape sequences (for clipboard, images, etc.)
set -g allow-passthrough on

# Enable extended keys for proper Shift+Enter, etc. support
set -g extended-keys on
set -s extended-keys always

# Forward extended keys to applications (needed for Shift+Enter in Claude Code, etc.)
set -as terminal-features ',*:extkeys'

# Bind Shift+Enter to send CSI u sequence (for Claude Code newline)
bind -n S-Enter send-keys Escape '[13;2u'

# Don't auto-rename windows (so your custom names stick)
set -g allow-rename off

# Set window and pane base index to 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Renumber windows when one is closed

# Set titles for terminal (useful for terminal tabs/windows)
set -g set-titles on
set -g set-titles-string "#S:#I.#P - #W"

# ----------------------------
# USER-DEFINED KEYBINDINGS & MODE SETTINGS
# ----------------------------

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable vi keys in copy mode
setw -g mode-keys vi
set-window-option -g mode-keys vi

# Smart pane switching with awareness of Vim splits (vim-tmux-navigator)
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# (Optional) Start copy mode with [ (like less/vim)
bind [ copy-mode

# (Optional) Use y to copy in visual mode, like vim
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind r
bind r source-file ~/.tmux.conf

bind -n C-q previous-window
bind -n C-e next-window
bind -n C-Tab last-window

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ----------------------------
# POPUP & TERMINAL SHORTCUTS
# ----------------------------

# Lazygit popup (prefix + g)
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# Quick terminal popup (prefix + t)
bind t display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# ----------------------------
# TMUX STATUSLINE CONFIGURATION
# ----------------------------

# Statusline position and refresh interval
set -g status-position top   # or 'bottom'
set -g status-interval 1     # Refresh every 1 second

# Theme Variables (customize these colors to your liking)
# These are inspired by the Dracula theme.
set -g @thm_bg '#282a36'       # Background color (dark grey)
set -g @thm_bg2 '#1d1d21'       # Secondary background color (darker)
set -g @thm_fg '#f8f8f2'       # Foreground color (light grey)
set -g @thm_blue '#6272a4'     # A nice blue for session name / separators
set -g @thm_green '#50fa7b'    # Green for active window
set -g @thm_yellow '#f1fa8c'   # Yellow for time/date
set -g @thm_red '#ff5555'      # Red for alerts/load average
set -g @thm_orange '#ffb86c'   # Orange for hostname / other elements
set -g @thm_cyan '#8be9fd'     # Cyan for inactive windows
set -g @thm_purple '#bd93f9'   # Purple for battery / other elements

# Default statusline style
set -g status-style "fg=#{@thm_fg},bg=#{@thm_bg}"

# ----------------------------
# Status Left: Session Name
# Example: [my_session]
# ----------------------------
#set -g status-left "\
#[fg=#{@thm_fg},bg=#{@thm_blue},bold] #S \
#[fg=#{@thm_blue},bg=#{@thm_bg},nobold]"

set -g status-left ""

# ----------------------------
# Window Status: Inactive and Active Windows
# ----------------------------

# How inactive windows look
# Example:  1:shell  2:editor
set -g window-status-format "\
#[fg=#{@thm_fg},bg=#{@thm_bg2}] #W \
#[fg=#{@thm_bg},bg=#{@thm_blue}] #I#[fg=#{@thm_blue},bg=#{@thm_bg}]"

# How the CURRENT active window looks (highlighted)
# Example:  #[green]1:shell  #[default]2:editor
# The separator  here connects the active window block to the main statusline background.
set -g window-status-current-format "\
#[fg=#{@thm_bg},bg=#{@thm_green}] #W \
#[fg=#{@thm_fg},bg=#{@thm_blue},bold] #I#[fg=#{@thm_blue},bg=#{@thm_bg}]"

# Align windows in the center of the statusline
set -g status-justify left

# ----------------------------
# Status Right: System Information
# Order (from right to left): Date/Time, Hostname, Load Average, CPU, Battery
# ----------------------------

set -g status-right-length 70

set -g status-right "\
#[fg=#{@thm_blue},bg=#{@thm_bg}]\
#[fg=#{@thm_fg},bg=#{@thm_blue}]\uf017 %H:%M [%a] %d.%m.%y \
#[fg=#{@thm_bg},bg=#{@thm_yellow}]  #{cpu}  #{mem} \
#[fg=#{@thm_bg},bg=#{@thm_purple}] 󰄌 #{battery_percentage} \
#[fg=#{@thm_purple},bg=#{@thm_bg},nobold]"

# ----------------------------
# PLUGINS
# ----------------------------
# List of plugins
set -g @plugin 'tmux-plugins/tpm'          # Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tmux-resurrect' # Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-battery'  # For more robust battery status in statusline (added this)
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'      # For CPU usage percentage in statusline (added this)
# set -g @plugin 'tmux-plugins/tmux-yank'      # Copy to system clipboard

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

